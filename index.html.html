<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Mini Block World — Touch</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#87c7ee;touch-action:none;font-family:system-ui}
canvas{display:block;width:100vw;height:100vh}
#hud{position:fixed;left:10px;top:10px;color:#fff;background:#0007;padding:8px 10px;border-radius:10px;font-size:13px;pointer-events:none}
#cross{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);color:#fff;font-size:24px;text-shadow:0 1px 3px #000;pointer-events:none}
#joy{position:fixed;left:18px;bottom:22px;width:126px;height:126px;border-radius:50%;background:#0003;border:2px solid #fff6}
#knob{position:absolute;left:38px;top:38px;width:50px;height:50px;border-radius:50%;background:#fff8}
#actions{position:fixed;right:18px;bottom:20px;width:150px;height:145px}
.btn{position:absolute;width:58px;height:58px;border:0;border-radius:50%;background:#fff9;font-size:25px;box-shadow:0 2px 8px #0005}
#jump{right:0;bottom:78px}#break{left:0;bottom:0}#place{right:0;bottom:0}
#tip{position:fixed;left:50%;top:20%;transform:translateX(-50%);background:#0009;color:#fff;padding:12px 15px;border-radius:12px;text-align:center;font-size:14px;pointer-events:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">Mini Block World · Touch<br>左下搖桿移動　右半邊拖曳轉視角<br>⛏️ 挖　🧱 放　⬆️ 跳</div>
<div id="cross">+</div>
<div id="joy"><div id="knob"></div></div>
<div id="actions"><button class="btn" id="jump">⬆️</button><button class="btn" id="break">⛏️</button><button class="btn" id="place">🧱</button></div>
<div id="tip">拖曳右側畫面看看 👆</div>
<script>
const c=document.querySelector('#c'),ctx=c.getContext('2d');
function resize(){c.width=innerWidth; c.height=innerHeight} addEventListener('resize',resize); resize();

const W=32,H=18,D=32,world=new Uint8Array(W*H*D);
const I=(a,b,d)=>a+W*(b+H*d), inside=(a,b,d)=>a>=0&&a<W&&b>=0&&b<H&&d>=0&&d<D;
function generate(){
 world.fill(0);
 for(let z=0;z<D;z++)for(let a=0;a<W;a++){
  let h=Math.max(2,Math.min(8,4+Math.floor(1.6*Math.sin(a*.5)+1.3*Math.sin(z*.43)+Math.random()*1.5)));
  for(let b=0;b<=h;b++)world[I(a,b,z)]=b===h?1:(b>=h-2?2:3);
  if(Math.random()<.05&&h+4<H){
   for(let b=1;b<=3;b++)world[I(a,h+b,z)]=4;
   for(let aa=-1;aa<=1;aa++)for(let dd=-1;dd<=1;dd++)for(let bb=3;bb<=4;bb++)
    if(inside(a+aa,h+bb,z+dd))world[I(a+aa,h+bb,z+dd)]=5;
  }
 }
}
generate();

let px=16,pz=16,py=10,vY=0,onGround=false,yaw=.5,pitch=0;
const joy=document.querySelector('#joy'),knob=document.querySelector('#knob');
let joyId=null,jx=0,jy=0;
function joyMove(t){
 const r=joy.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
 let dx=t.clientX-cx,dy=t.clientY-cy, m=Math.hypot(dx,dy),max=38;
 if(m>max){dx=dx/m*max;dy=dy/m*max}
 jx=dx/max;jy=dy/max;knob.style.transform=`translate(${dx}px,${dy}px)`;
}
joy.addEventListener('touchstart',e=>{joyId=e.changedTouches[0].identifier;joyMove(e.changedTouches[0]);e.preventDefault()},{passive:false});
joy.addEventListener('touchmove',e=>{for(const t of e.changedTouches)if(t.identifier===joyId)joyMove(t);e.preventDefault()},{passive:false});
joy.addEventListener('touchend',e=>{for(const t of e.changedTouches)if(t.identifier===joyId){joyId=null;jx=jy=0;knob.style.transform='translate(0,0)'}},{passive:false});

let lookId=null,lastX=0,lastY=0;
c.addEventListener('touchstart',e=>{
 for(const t of e.changedTouches){
  if(t.clientX>innerWidth*.42 && lookId===null){lookId=t.identifier;lastX=t.clientX;lastY=t.clientY}
 }
},{passive:true});
c.addEventListener('touchmove',e=>{
 for(const t of e.changedTouches)if(t.identifier===lookId){
  yaw+=(t.clientX-lastX)*.006; pitch=Math.max(-1.15,Math.min(1.15,pitch-(t.clientY-lastY)*.006));lastX=t.clientX;lastY=t.clientY;
 }
},{passive:true});
c.addEventListener('touchend',e=>{for(const t of e.changedTouches)if(t.identifier===lookId)lookId=null},{passive:true});

function solid(a,b,d){return inside(a,b,d)&&world[I(a,b,d)]>0}
function ray(){
 let dx=Math.sin(yaw)*Math.cos(pitch),dy=Math.sin(pitch),dz=Math.cos(yaw)*Math.cos(pitch),prev=null;
 for(let t=0;t<7;t+=.08){
  let q={x:Math.floor(px+dx*t),y:Math.floor(py+dy*t),z:Math.floor(pz+dz*t)};
  if(inside(q.x,q.y,q.z)&&world[I(q.x,q.y,q.z)]>0)return {...q,prev};
  prev=q;
 }
}
function mine(){let r=ray();if(r)world[I(r.x,r.y,r.z)]=0}
function place(){let r=ray();if(r&&r.prev&&inside(r.prev.x,r.prev.y,r.prev.z)&&world[I(r.prev.x,r.prev.y,r.prev.z)]===0)world[I(r.prev.x,r.prev.y,r.prev.z)]=1}
function jump(){if(onGround){vY=.19;onGround=false}}

document.querySelector('#break').ontouchstart=e=>{mine();e.preventDefault()};
document.querySelector('#place').ontouchstart=e=>{place();e.preventDefault()};
document.querySelector('#jump').ontouchstart=e=>{jump();e.preventDefault()};

function physics(){
 let sp=.075,mx=0,mz=0;
 if(Math.abs(jx)+Math.abs(jy)>.08){mx=Math.sin(yaw)*(-jy)*sp+Math.cos(yaw)*jx*sp;mz=Math.cos(yaw)*(-jy)*sp-Math.sin(yaw)*jx*sp}
 px+=mx;pz+=mz;px=Math.max(.6,Math.min(W-.6,px));pz=Math.max(.6,Math.min(D-.6,pz));
 vY-=.012;py+=vY;
 let bx=Math.floor(px),bz=Math.floor(pz),floor=-1;
 for(let b=0;b<H;b++)if(solid(bx,b,bz))floor=b;
 if(floor>=0&&py<floor+1.7){py=floor+1.7;vY=0;onGround=true}else onGround=false;
}
function project(wx,wy,wz){
 let dx=wx-px,dz=wz-pz,dy=wy-py;
 let X=dx*Math.cos(yaw)-dz*Math.sin(yaw),Z=dx*Math.sin(yaw)+dz*Math.cos(yaw);
 let Y=dy*Math.cos(pitch)-Z*Math.sin(pitch);Z=dy*Math.sin(pitch)+Z*Math.cos(pitch);
 if(Z<=.1)return null;let f=Math.min(c.width,c.height)*.95/Z;
 return [c.width/2+X*f,c.height/2-Y*f];
}
function draw(){
 let g=ctx.createLinearGradient(0,0,0,c.height);g.addColorStop(0,'#76b8ed');g.addColorStop(1,'#e0f2f8');ctx.fillStyle=g;ctx.fillRect(0,0,c.width,c.height);
 let faces=[];
 for(let z=0;z<D;z++)for(let a=0;a<W;a++)for(let b=0;b<H;b++){
  let t=world[I(a,b,z)];if(!t||Math.hypot(a+.5-px,z+.5-pz)>24)continue;
  const V=[[a,b,z],[a+1,b,z],[a+1,b+1,z],[a,b+1,z],[a,b,z+1],[a+1,b,z+1],[a+1,b+1,z+1],[a,b+1,z+1]];
  const F=[[0,1,2,3],[4,5,6,7],[0,4,7,3],[1,5,6,2],[3,2,6,7],[0,1,5,4]];
  for(const f of F){let p=f.map(i=>project(...V[i]));if(p.some(v=>!v))continue;
   let col=t===1?'#67b34b':t===2?'#8a5b32':t===3?'#77706a':t===4?'#6b4728':'#3f8b3a';
   faces.push({z:p.reduce((s,v)=>s+v[1],0),p,col});
  }
 }
 faces.sort((a,b)=>a.z-b.z);
 for(const f of faces){ctx.beginPath();ctx.moveTo(...f.p[0]);for(let i=1;i<f.p.length;i++)ctx.lineTo(...f.p[i]);ctx.closePath();ctx.fillStyle=f.col;ctx.fill();ctx.strokeStyle='#0002';ctx.stroke()}
}
function loop(){physics();draw();requestAnimationFrame(loop)}loop();
setTimeout(()=>document.querySelector('#tip').style.display='none',3500);
</script>
</body></html>
